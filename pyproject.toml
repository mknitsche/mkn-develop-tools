[project]
name = "mkn-develop-tools"
version = "0.0.0"
description = "Standalone tools by Matthias Nitsche - monorepo root (tooling only, not published)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/kern/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
pythonpath = ["packages/kern/src", "packages/foto/src"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["packages"]
