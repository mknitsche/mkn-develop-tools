[project]
name = "mkn-dokument"
version = "0.2.0"
description = "Dokumente (PDF, Scan, Foto) lesen: Werte, Seitenkopf und Texte, Diagramme ablesen; zwei Modelle lesen jede Seite vom Bild, ein Abgleich uebernimmt nur, worin sie uebereinstimmen; EPUB ohne Modell lesen"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Matthias Nitsche" }]
readme = "README.md"
# pymupdf: PDF und Bilddateien oeffnen, Seiten als Bild rendern, Bildgroesse fuer das Ablesen. mkn-kern: die Modell-Anfrage.
# defusedxml: die Steuerdateien eines EPUB (container, OPF, encryption, NCX) ohne Entitaeten und externe Verweise.
dependencies = [
    "pymupdf>=1.24",
    "mkn-kern>=0.3",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# pillow: nur fuer den Test, der ein gedrehtes Foto mit EXIF-Angabe erzeugt.
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[project.scripts]
mkn-dokument = "mkn_dokument.kommandozeile:haupt"

# Im Arbeitsbereich kommt das Geschwisterpaket aus dem Repo, nicht aus einem Index; fuer einen
# Build nach aussen bleibt die Anforderung `mkn-kern>=0.3` massgeblich.
[tool.uv.sources]
mkn-kern = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkn_dokument"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Der Leseauftrag ist ein Text an ein Modell: seine Zeilen sind Saetze, keine Code-Zeilen.
"src/mkn_dokument/auftrag.py" = ["E501"]
"src/mkn_dokument/seitenlesung.py" = ["E501"]
"src/mkn_dokument/ablesen.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
