[project]
name = "mkn-audio"
version = "0.3.1"
description = "Quelle (EPUB, PDF, Text, Foto) in eine Hoerdatei mit Kapiteln verwandeln"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Matthias Nitsche" }]
readme = "README.md"
# pymupdf: PDF lesen und Seiten als Bild rendern. num2words: Zahlen ausschreiben.
# beautifulsoup4 + defusedxml: EPUB lesen -- defusedxml, weil eine fremde Datei
#   keine externen Entitaeten aufloesen darf. mkn-kern: die Modell-Anfrage.
dependencies = [
    "pymupdf>=1.24",
    "num2words>=0.5.13",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "mkn-kern>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mkn-mp4-local = "mkn_audio.kommandozeile:haupt_local"
mkn-mp4-gemini = "mkn_audio.kommandozeile:haupt_gemini"

# Im Arbeitsbereich kommt das Geschwisterpaket aus dem Repo, nicht aus einem Index; fuer einen
# Build nach aussen bleibt die Anforderung `mkn-kern>=0.3` massgeblich.
[tool.uv.sources]
mkn-kern = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkn_audio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
