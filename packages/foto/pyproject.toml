[project]
name = "mkn-foto"
version = "0.1.0"
description = "Photo workflow tools - enrich RAW and JPEG with place, series and keywords"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Matthias Nitsche" }]
readme = "README.md"
# Pillow: Vorschauen verkleinern und Kontaktboegen bauen (Spec Paragraf 4a/10).
# Bewusst die einzige Laufzeit-Abhaengigkeit -- alles andere ist stdlib plus
# exiftool, das ohnehin auf dem Rechner liegen muss.
dependencies = ["Pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkn_foto"]
