[project]
name = "mkn-kern"
version = "0.2.0"
description = "Shared foundation for the mkn tools - no provider, no infrastructure, no assumptions"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Matthias Nitsche" }]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkn_kern"]
