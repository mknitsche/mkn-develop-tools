name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv tool run ruff@0.14.0 check .
      - run: uv tool run ruff@0.14.0 format --check .
      # exiftool ist keine Bequemlichkeit: die Haelfte der Foto-Tests schreibt
      # und liest damit echte Dateien. Ohne es ueberspringt pytest sie, und die
      # CI meldet gruen fuer eine Suite, die ihren Gegenstand nicht angefasst
      # hat (LP-34: ein Beweis muss seinen Gegenstand enthalten).
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      # `uv sync` INSTALLIERT die Pakete des Workspace samt ihrer
      # Abhaengigkeiten. Der frueher hier stehende Aufruf `uv run --with pytest`
      # holte nur pytest; `Pillow` fehlte, und jeder Lauf seit dem ersten Commit
      # brach beim Import ab.
      - run: uv sync --all-packages --dev
      - run: uv run pytest -q
      # Und der Riegel gegen das naechste stille Gruen: uebersprungene Tests
      # sind kein Erfolg. Waere er von Anfang an dagewesen, haette die CI
      # gesagt, dass sie die halbe Suite nicht anfasst.
      - name: Kein Test wurde stillschweigend uebersprungen
        run: |
          set -euo pipefail
          ausgabe=$(uv run pytest -q -rs 2>&1 | tail -40)
          echo "$ausgabe"
          if echo "$ausgabe" | grep -qE '[0-9]+ skipped'; then
            echo "::error::Tests wurden uebersprungen - gruen bedeutet hier nicht geprueft"
            exit 1
          fi

  # NOTE ON THE MATRIX. An earlier draft ran three operating systems by three
  # Python versions. With no platform-dependent code in the repository, those
  # nine jobs proved nothing they did not already prove on one - they were cost
  # without a question behind them. The matrix comes back when there is code
  # that can actually differ per platform (the photo tools call an external
  # programme and touch the filesystem; that is the moment), and it comes back
  # because a real failure mode demands it.

  dco:
    # Contributions come in under the Developer Certificate of Origin, and
    # checking it after a merge is worthless.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          set -euo pipefail
          basis="${{ github.event.pull_request.base.sha }}"
          spitze="${{ github.event.pull_request.head.sha }}"
          anzahl=$(git rev-list --no-merges --count "$basis".."$spitze")
          if [ "$anzahl" -eq 0 ]; then
            echo "::warning::no non-merge commits - nothing was checked"
            exit 0
          fi
          fehlend=0
          for c in $(git rev-list --no-merges "$basis".."$spitze"); do
            if ! git log -1 --format=%B "$c" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $c has no Signed-off-by trailer"
              fehlend=$((fehlend + 1))
            fi
          done
          [ "$fehlend" -eq 0 ] || { echo "See CONTRIBUTING.md - use 'git commit -s'."; exit 1; }
          echo "$anzahl commit(s) checked, all signed off."
