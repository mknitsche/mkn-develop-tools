name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff@0.14.0 check .
      - run: uv tool run ruff@0.14.0 format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # The tools must run where the users are, not only where they were
        # written. macOS is the development machine; that is not a requirement.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install pytest pytest-cov
      - name: Run tests
        run: uv run pytest -q

  dco:
    # Contributions come in under the Developer Certificate of Origin. Checking
    # it after a merge is worthless, so it is checked on the pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          set -euo pipefail
          basis="${{ github.event.pull_request.base.sha }}"
          spitze="${{ github.event.pull_request.head.sha }}"
          fehlend=0
          # Merge-Commits ausgenommen: die erzeugt GitHub, nicht der Beitragende.
          for c in $(git rev-list --no-merges "$basis".."$spitze"); do
            if ! git log -1 --format=%B "$c" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $c has no Signed-off-by trailer"
              git log -1 --format='  %h %s' "$c"
              fehlend=$((fehlend + 1))
            fi
          done
          if [ "$fehlend" -gt 0 ]; then
            echo "$fehlend commit(s) without sign-off. See CONTRIBUTING.md - use 'git commit -s'."
            exit 1
          fi
          # Untergrenze: wenn gar nichts geprueft wurde, ist "alles in Ordnung"
          # keine Aussage (CONTRIBUTING, Regel 4).
          anzahl=$(git rev-list --no-merges --count "$basis".."$spitze")
          if [ "$anzahl" -eq 0 ]; then
            echo "::warning::no non-merge commits in this pull request - nothing was checked"
          else
            echo "$anzahl commit(s) checked, all signed off."
          fi
